[project]
name = "warehouse-ops-mcp"
version = "0.1.0"
description = "MCP server that lets Claude answer distribution center questions: yard, docks, slotting, inventory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0",
]

[project.scripts]
warehouse-ops-mcp = "warehouse_ops.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_ops"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
